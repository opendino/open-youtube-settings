# Offline test suite (static, Chromium fixture, Firefox) on every push to main
# and every pull request. Live youtube.com tests stay local: running them from
# CI would trip Google's "unusual traffic" check.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Also downloads Firefox through Puppeteer's postinstall (.puppeteerrc.cjs).
      - run: npm ci

      - name: Install test browsers and their system libraries
        run: |
          npm run test:install
          npx playwright install-deps chromium firefox

      - run: npm test

      - name: Keep failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

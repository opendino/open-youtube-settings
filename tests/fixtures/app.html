<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouTube (fixture)</title>
  <style>
    body { margin: 0; font: 14px sans-serif; background: #0f0f0f; color: #f1f1f1; }
    ytd-app, ytd-page-manager, ytd-browse, ytd-watch-flexy, ytd-watch-metadata, ytd-comments,
    ytd-engagement-panel-section-list-renderer, ytd-playlist-panel-renderer,
    ytd-watch-next-secondary-results-renderer, ytd-rich-grid-renderer, ytd-shorts,
    ytd-reel-video-renderer, ytd-rich-item-renderer, yt-lockup-view-model, ytd-video-renderer,
    ytd-rich-shelf-renderer, ytm-shorts-lockup-view-model-v2, ytd-search, ytd-section-list-renderer,
    ytd-item-section-renderer, ytd-channel-name { display: block; }
    ytd-rich-grid-renderer { display: grid; grid-template-columns: repeat(3, 300px); gap: 16px; }
    yt-lockup-view-model, ytd-video-renderer { min-height: 90px; margin-bottom: 8px; background: #272727; }
    .thumbnail { display: block; height: 60px; background: #555; }
    .ytp-videowall-still { display: block; background: #333; color: #fff; }
    #columns { display: flex; gap: 24px; padding: 24px; }
    #primary { flex: 1; max-width: 960px; }
    #secondary { width: 400px; }
    .html5-video-player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
    .html5-video-container { position: absolute; inset: 0; }
    .html5-video-container video { width: 100%; height: 100%; }
    .ytp-chrome-bottom { position: absolute; left: 12px; right: 12px; bottom: 0; height: 48px; }
    .ytp-gradient-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; }
    .ytp-bezel { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; }
    ytd-engagement-panel-section-list-renderer[visibility="ENGAGEMENT_PANEL_VISIBILITY_HIDDEN"] { display: none; }
    .item { height: 90px; margin-bottom: 8px; background: #272727; }
    ytd-reel-video-renderer .html5-video-player { width: 360px; aspect-ratio: 9 / 16; }
  </style>
</head>
<body>
  <ytd-app>
    <ytd-page-manager id="page-manager"></ytd-page-manager>
  </ytd-app>
  <script src="/__fixture/app.js"></script>
</body>
</html>

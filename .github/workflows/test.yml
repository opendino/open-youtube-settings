# Offline test suite (static, Chromium fixture, Firefox). Runs before every
# release (called from release.yml) or by hand from the Actions tab; pushes
# are tested locally before they are sent. Live youtube.com tests stay local:
# running them from CI would trip Google's "unusual traffic" check.
name: Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Also downloads Firefox through Puppeteer's postinstall (.puppeteerrc.cjs).
      - run: npm ci

      - name: Install test browsers and their system libraries
        run: |
          npm run test:install
          npx playwright install-deps chromium firefox

      - run: npm test

      - name: Keep failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
